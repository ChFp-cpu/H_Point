services:
  app:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      APP_ENV: production
      TRUST_PROXY_HEADERS: "1"
      RUN_TELEGRAM_BOT: "0"
      REGISTRATION_BONUS_RUB: ${REGISTRATION_BONUS_RUB:-500}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    build: .
    command: ["python", "run_bot.py"]
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: production
      TRUST_PROXY_HEADERS: "1"
      RUN_TELEGRAM_BOT: "1"
      REGISTRATION_BONUS_RUB: ${REGISTRATION_BONUS_RUB:-500}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
