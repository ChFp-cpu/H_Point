{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">НОВАЯ ЗАЯВКА</div><h1>Мне нужна помощь</h1><p class="muted">После откликов вы сами выбираете, кому доверить задачу.</p></div></div><form class="card form" method="post"><label>Что нужно сделать?<textarea name="what" maxlength="500" required>{{data.get('what','')}}</textarea></label><label>Где?<input name="place" maxlength="500" required value="{{data.get('place','')}}"></label><label>Когда?<input name="time_needed" maxlength="500" required value="{{data.get('time_needed','')}}"></label><label>Срочность<select name="urgency" required>{% for x in urgency_options %}<option {% if data.get('urgency')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Дополнительные детали<textarea name="details" maxlength="500">{{data.get('details','')}}</textarea></label><label>Какие навыки нужны от помощника?<textarea name="required_skills" maxlength="500" placeholder="Python, ремонт ПК, физика...">{{data.get('required_skills','')}}</textarea></label><div class="form-actions"><a class="secondary" href="{{url_for('dashboard')}}">Отмена</a><button class="primary">Создать заявку</button></div></form>{% endblock %}
