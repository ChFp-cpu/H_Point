name: Verify H-Point

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile run.py run_bot.py hpoint/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate production Compose file
        run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - name: Build production image
        run: docker build --tag hpoint-ci:latest .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check known dependency vulnerabilities
        run: python -m pip install --upgrade pip pip-audit && pip-audit -r requirements.txt

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpoint_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: hpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hpoint_test -d hpoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HPOINT_TEST_DATABASE_URL: postgresql://hpoint_test:local_ci_only@127.0.0.1:5432/hpoint_test
      DATABASE_URL: ""
      DB_PATH: /tmp/hpoint-ci-bootstrap.db
      BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settlement, migrations and concurrent lifecycle operations on PostgreSQL
        run: |
          python -m unittest discover -s tests -p 'test_postgres.py' -v
          python -m unittest discover -s tests -p 'test_commercial_concurrency.py' -v
