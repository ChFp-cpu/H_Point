name: Check production uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [codex/stabilize-mvp]
    paths: [.github/workflows/uptime.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS health endpoint
        id: health
        run: |
          # A transient route failure must be retried before declaring an outage.
          # Use IPv4 consistently and validate JSON fields, not its whitespace.
          body=$(curl --ipv4 --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --retry 3 --retry-all-errors \
            --retry-delay 3 --retry-max-time 100 https://gethpoint.ru/api/health)
          printf '%s' "$body" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True and data.get("database") is True, "Application or database is unhealthy"'
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail --silent --show-error --max-time 15 \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=⚠️ H-Point недоступен: https://gethpoint.ru/api/health%0A$RUN_URL" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          fi
