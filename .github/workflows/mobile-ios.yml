name: Build H-Point for iOS

on:
  push:
    branches: [main, codex/flutter-app]
    paths: [mobile/**, .github/workflows/mobile-ios.yml]
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/mobile-ios.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpoint-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_REVISION: c197ca5199e9ee5661e865596c9c07294dfab51c
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"
  BUNDLE_ID: ru.gethpoint.hpoint

jobs:
  build:
    name: iOS ${{ matrix.target }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [simulator, iphone]
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter and Xcode
        run: |
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --quiet --depth 1 --single-branch --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$flutter_dir"
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          printf '%s\n' "$flutter_dir/bin" >> "$GITHUB_PATH"
          "$flutter_dir/bin/flutter" --version
          xcodebuild -version

      - name: Start iPhone Simulator
        if: matrix.target == 'simulator'
        run: |
          selection="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, rows in devices.items() if ".iOS-" in runtime
                    for d in rows if d["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone Simulator")
          device = next((d for d in phones if d["state"] == "Booted"), phones[0])
          print(device["udid"], device["state"])
          ')"
          read -r device state <<< "$selection"
          if [[ "$state" != Booted ]]; then
            xcrun simctl boot "$device"
          fi
          printf 'IOS_SIMULATOR_UDID=%s\n' "$device" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test the mobile app
        if: matrix.target == 'simulator'
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build the iPhone Simulator app
        if: matrix.target == 'simulator'
        run: flutter build ios --simulator --debug --no-codesign --no-pub

      - name: Install and launch on iPhone Simulator
        if: matrix.target == 'simulator'
        run: |
          device="$IOS_SIMULATOR_UDID"
          app=build/ios/iphonesimulator/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$BUNDLE_ID"
          # A Simulator build can use an ad hoc signature with its own Keychain group.
          entitlements="$RUNNER_TEMP/hpoint-simulator.entitlements"
          /usr/libexec/PlistBuddy \
            -c "Add :application-identifier string SIMULATOR0.$BUNDLE_ID" \
            -c "Add :keychain-access-groups array" \
            -c "Add :keychain-access-groups:0 string SIMULATOR0.$BUNDLE_ID" "$entitlements"
          codesign --force --sign - --entitlements "$entitlements" "$app"
          codesign --verify "$app"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          launch="$(xcrun simctl launch --stdout="$RUNNER_TEMP/hpoint-simulator.log" "$device" "$BUNDLE_ID")"
          echo "$launch"
          pid="${launch##*: }"
          [[ "$pid" =~ ^[0-9]+$ ]]
          sleep 12
          kill -0 "$pid"
          if [[ -f "$RUNNER_TEMP/hpoint-simulator.log" ]]; then
            grep -F 'H-Point session storage:' "$RUNNER_TEMP/hpoint-simulator.log" || true
          fi
          mkdir -p "$RUNNER_TEMP/hpoint-ios-simulator"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/hpoint-ios-simulator/H-Point-iPhone.png"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/hpoint-ios-simulator/H-Point-Simulator.zip"
          xcrun simctl shutdown "$device"

      - name: Upload the verified Simulator build
        if: matrix.target == 'simulator'
        uses: actions/upload-artifact@v7
        with:
          name: H-Point-iOS-Simulator
          path: ${{ runner.temp }}/hpoint-ios-simulator/
          if-no-files-found: error
          compression-level: 0

      - name: Build the unsigned iPhone archive
        if: matrix.target == 'iphone'
        run: |
          flutter build ipa --release --no-codesign --no-pub
          archive=build/ios/archive/Runner.xcarchive
          app="$archive/Products/Applications/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$BUNDLE_ID"
          ditto -c -k --keepParent "$archive" "$RUNNER_TEMP/H-Point-iPhone-Unsigned.xcarchive.zip"

      - name: Upload the unsigned iPhone archive
        if: matrix.target == 'iphone'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/H-Point-iPhone-Unsigned.xcarchive.zip
          archive: false
          if-no-files-found: error
