name: hpoint
description: "H-Point — помощь рядом."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
    - assets/logo-dark.webp
    - assets/neighbors.webp
